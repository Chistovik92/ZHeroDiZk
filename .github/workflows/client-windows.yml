name: Windows client

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Also build installable packages and keep them as a build artifact (test releases)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      package:
        type: boolean
        default: true
  push:
    branches: ['claude/windows-client']
    paths:
      - '.github/workflows/client-windows.yml'
      - 'tools/prepare_client.py'
      - 'tools/check_windows_identity.py'
      - 'client/windows-identity.json'

permissions:
  contents: read

concurrency:
  group: windows-client-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  RUST_VERSION: '1.75.0'
  FLUTTER_VERSION: '3.24.5'
  BRIDGE_FLUTTER_VERSION: '3.22.3'
  VCPKG_COMMIT_ID: '120deac3062162151622ca4860575a33844ba10b'

# Verification build only: no signing, no installer, no publication.
# Versions and the vcpkg commit are taken from the pinned upstream CI.
jobs:
  bridge:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Fetch and prepare pinned client
        run: |
          python3 tools/bootstrap.py --submodules
          python3 tools/prepare_client.py vendor/client --profile zherodizk --platform windows --report dist/source.json

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
          rustup default "$RUST_VERSION"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Generate Rust Dart bridge
        working-directory: vendor/client
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          sed -i 's/extended_text: 14.0.0/extended_text: 13.0.0/' flutter/pubspec.yaml
          (cd flutter && flutter pub get)
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp flutter/macos/Runner/bridge_generated.h flutter/ios/Runner/bridge_generated.h
          git restore flutter/pubspec.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: bridge-files
          retention-days: 3
          path: |
            vendor/client/src/bridge_generated.rs
            vendor/client/src/bridge_generated.io.rs
            vendor/client/flutter/lib/generated_bridge.dart
            vendor/client/flutter/lib/generated_bridge.freezed.dart
            vendor/client/flutter/macos/Runner/bridge_generated.h
            vendor/client/flutter/ios/Runner/bridge_generated.h

  build:
    needs: bridge
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      VCPKG_ROOT: C:/vcpkg-zhd
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Fetch and prepare pinned client
        run: |
          python tools/bootstrap.py --submodules
          python tools/prepare_client.py vendor/client --profile zherodizk --platform windows --report dist/build-report/source.json

      - name: Restore generated bridge
        uses: actions/download-artifact@v4
        with:
          name: bridge-files
          path: vendor/client

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: '15.0.6'

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # The upstream build replaces the Windows engine with an unpinned release
      # asset. Its SHA-256 is recorded in the build report for review.
      - name: Replace Flutter engine as upstream does
        run: |
          flutter precache --windows
          curl -fsSL -o engine.zip https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip
          mkdir -p dist/build-report
          sha256sum engine.zip | tee dist/build-report/engine-sha256.txt
          unzip -q engine.zip -d engine-files
          engine_dir="$(cygpath -u "$FLUTTER_ROOT")/bin/cache/artifacts/engine/windows-x64-release"
          test -d "$engine_dir"
          cp -rf engine-files/* "$engine_dir/"

      - name: Patch Flutter SDK
        run: python tools/apply_patch_once.py "$FLUTTER_ROOT" vendor/client/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --target x86_64-pc-windows-msvc
          rustup default "$RUST_VERSION"

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: C:/vcpkg-cache
          key: vcpkg-win-v1-${{ hashFiles('upstream.lock.json') }}

      - name: Install pinned vcpkg and codecs
        working-directory: vendor/client
        env:
          # As in the upstream build: host and target triplet must both be static,
          # otherwise ffmpeg is built for x64-windows only and the codec crate cannot find it.
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
          VCPKG_DEFAULT_BINARY_CACHE: C:/vcpkg-cache
        run: |
          mkdir -p C:/vcpkg-cache
          git init "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT" fetch origin "$VCPKG_COMMIT_ID"
          git -C "$VCPKG_ROOT" checkout --detach FETCH_HEAD
          "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          "$VCPKG_ROOT/vcpkg.exe" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Build client
        working-directory: vendor/client
        run: python build.py --portable --flutter --skip-portable-pack --hwcodec

      - name: Check build output and identity
        run: |
          out=vendor/client/flutter/build/windows/x64/runner/Release
          ls -l "$out"
          test -s "$out/zherodizk.exe"
          test -s "$out/librustdesk.dll"
          powershell -NoProfile -Command "(Get-Item '$out/zherodizk.exe').VersionInfo | Select-Object ProductName,InternalName,OriginalFilename,CompanyName,FileDescription,LegalCopyright | ConvertTo-Json" > dist/build-report/version-info.json
          cat dist/build-report/version-info.json
          python tools/check_windows_identity.py dist/build-report/version-info.json "$out"
          sha256sum "$out/zherodizk.exe" "$out/librustdesk.dll" > dist/build-report/binaries.sha256
          python tools/check_client_network.py "$out/zherodizk.exe" "$out/librustdesk.dll" $(find "$out" -name app.so) | tee dist/build-report/network-check.txt
          git -C vendor/client diff --stat > dist/build-report/upstream-changes.txt
          rustc --version > dist/build-report/rust-version.txt
          flutter --version > dist/build-report/flutter-version.txt
          cat dist/build-report/binaries.sha256

      - name: Component and licence report
        run: |
          (cd vendor/client && cargo metadata --format-version 1 --locked --filter-platform x86_64-pc-windows-msvc) > dist/build-report/cargo-metadata.json
          python tools/sbom.py --cargo-metadata dist/build-report/cargo-metadata.json \
            --pubspec-lock vendor/client/flutter/pubspec.lock \
            --dart-package-config vendor/client/flutter/.dart_tool/package_config.json \
            --vcpkg-installed "$VCPKG_ROOT/installed" \
            --output dist/build-report/sbom.cdx.json | tee dist/build-report/sbom-summary.txt
          rm dist/build-report/cargo-metadata.json

      - name: Build the portable archive (test releases only)
        if: inputs.package
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          out=vendor/client/flutter/build/windows/x64/runner/Release
          name="zherodizk-client-$version-windows-x64-portable"
          mkdir -p "dist/stage/$name" dist/packages
          cp -a "$out/." "dist/stage/$name/"
          cp LICENSE NOTICE "dist/stage/$name/"
          cp vendor/client/LICENCE "dist/stage/$name/THIRD-PARTY-LICENCE"
          cp packaging/client/README-windows.txt "dist/stage/$name/README.txt"
          (cd dist/stage && 7z a -tzip -mx=9 "../packages/$name.zip" "$name" > /dev/null)
          (cd dist/packages && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Keep the archive for the release
        if: inputs.package
        uses: actions/upload-artifact@v4
        with:
          name: windows-client-dist
          path: dist/packages/
          retention-days: 7

      # Diagnostic evidence is always uploaded; packages only for explicit test releases (package=true); executables otherwise stay on the runner
      # until the project's source, licence and security release gates pass.
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-client-build-evidence
          path: dist/build-report/
          if-no-files-found: warn
          retention-days: 14
