name: control-server

on:
  workflow_dispatch:
  push:
    paths:
      - 'crates/control/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/control.yml'
  pull_request:
    paths:
      - 'crates/control/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/control.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zhd
          POSTGRES_PASSWORD: zhd-test-only
          POSTGRES_DB: zhd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZHD_TEST_DATABASE_URL: postgres://zhd:zhd-test-only@localhost:5432/zhd_test
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component clippy && rustup default 1.85.1
      - name: Tests (unit and PostgreSQL integration)
        run: cargo test -p zherodizk-control -- --nocapture
      - name: Clippy
        run: cargo clippy -p zherodizk-control --all-targets -- -D warnings
      - name: Keep the resolved lock file for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: ignore
          retention-days: 7
