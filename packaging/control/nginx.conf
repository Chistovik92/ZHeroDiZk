# TLS termination in front of the control server (certificate paths are examples).
server {
    listen 443 ssl http2;
    server_name control.example.org;
    ssl_certificate     /etc/ssl/certs/control.example.org.pem;
    ssl_certificate_key /etc/ssl/private/control.example.org.key;

    location / {
        proxy_pass http://127.0.0.1:21114;
        proxy_set_header Host $host;
        # Replace any client-supplied value; then set ZHD_TRUST_FORWARDED_FOR=true.
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
