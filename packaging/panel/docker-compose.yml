# Web panel in nginx. Unpack the panel archive, run this file from its directory:
#   docker compose up -d       # panel on http://127.0.0.1:8080
# ZHD_CONTROL_UPSTREAM is the control server address as seen from the container. The default
# host.docker.internal reaches a control server on the Docker host that listens on an address the
# bridge can reach (not only 127.0.0.1); for a control server in another compose project, join
# the networks and use its service name, e.g. http://control:21114.
# Put a TLS reverse proxy in front before using it outside a trusted network.
services:
  panel:
    image: nginx:1.27-alpine
    environment:
      ZHD_CONTROL_UPSTREAM: ${ZHD_CONTROL_UPSTREAM:-http://host.docker.internal:21114}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:8080:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
