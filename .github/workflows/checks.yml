name: source-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python integration tests
        run: python -m unittest discover -s tests -v
      - name: Lock validation
        run: python tools/bootstrap.py --check-lock
      - name: Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal
      - name: Rust policy tests
        run: cargo +1.85.1 test --workspace --offline

