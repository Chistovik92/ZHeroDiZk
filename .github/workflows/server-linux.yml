name: Linux server

on:
  workflow_dispatch:
  push:
    branches: ['claude/server-linux']
    paths:
      - '.github/workflows/server-linux.yml'
      - 'tools/bootstrap.py'
      - 'tools/prepare_server.py'
      - 'server/identity.json'
      - 'packaging/**'
      - 'upstream.lock.json'

permissions:
  contents: read

concurrency:
  group: linux-server-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: '1.90.0'
  CROSS_VERSION: '0.2.5'

# Verification build of the pinned rendezvous/relay server sources.
# Binaries are built as static musl executables for each target (as the pinned
# upstream CI does) and only checksums are published as evidence.
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Test project tools
        run: python3 -m unittest discover -s tests

      - name: Fetch pinned server sources
        run: |
          python3 tools/bootstrap.py --component server --submodules
          python3 tools/prepare_server.py vendor/server --report dist/build-report/source.json

      - name: Install Rust and cross
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target ${{ matrix.target }}
          rustup default "$RUST_VERSION"
          cargo install cross --version "$CROSS_VERSION" --locked

      - name: Build server binaries
        working-directory: vendor/server
        run: cross build --release --all-features --target ${{ matrix.target }}

      - name: Check binaries and write evidence
        run: |
          out=vendor/server/target/${{ matrix.target }}/release
          mkdir -p dist/build-report
          for bin in zhd-rendezvous zhd-relay zhd-utils; do
            test -x "$out/$bin"
            file "$out/$bin" | tee -a dist/build-report/file-types.txt
          done
          for old in hbbs hbbr rustdesk-utils; do
            if [ -e "$out/$old" ]; then echo "unexpected upstream-named binary: $old"; exit 1; fi
          done
          sha256sum "$out/zhd-rendezvous" "$out/zhd-relay" "$out/zhd-utils" > dist/build-report/binaries.sha256
          cat dist/build-report/binaries.sha256
          git -C vendor/server rev-parse HEAD > dist/build-report/server-commit.txt
          git -C vendor/server submodule status --recursive > dist/build-report/server-submodules.txt
          git -C vendor/server diff --stat > dist/build-report/upstream-changes.txt
          if [ "${{ matrix.target }}" = x86_64-unknown-linux-musl ]; then
            "$out/zhd-rendezvous" --help > dist/build-report/rendezvous-help.txt 2>&1 || true
            "$out/zhd-relay" --help > dist/build-report/relay-help.txt 2>&1 || true
            "$out/zhd-utils" > dist/build-report/utils-help.txt 2>&1 || true
            cat dist/build-report/*-help.txt
            grep -q ZHeroDiZk dist/build-report/rendezvous-help.txt
            grep -q ZHeroDiZk dist/build-report/relay-help.txt
            if grep -qi 'rustdesk\|purslane' dist/build-report/*-help.txt; then echo "third-party name in help output"; exit 1; fi
            # Smoke test: both services start and listen on their default ports.
            mkdir -p "$RUNNER_TEMP/zhd" && cd "$RUNNER_TEMP/zhd"
            "$GITHUB_WORKSPACE/$out/zhd-rendezvous" > rendezvous.log 2>&1 &
            rpid=$!
            "$GITHUB_WORKSPACE/$out/zhd-relay" > relay.log 2>&1 &
            bpid=$!
            sleep 5
            (echo > /dev/tcp/127.0.0.1/21116) && echo "rendezvous listens on 21116"
            (echo > /dev/tcp/127.0.0.1/21117) && echo "relay listens on 21117"
            kill $rpid $bpid || true
            cp rendezvous.log relay.log "$GITHUB_WORKSPACE/dist/build-report/"
          fi

      - name: Build packages
        run: |
          out="$PWD/vendor/server/target/${{ matrix.target }}/release"
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          case "${{ matrix.target }}" in
            x86_64-*) deb_arch=amd64; rpm_arch=x86_64; tar_arch=x86_64 ;;
            aarch64-*) deb_arch=arm64; rpm_arch=aarch64; tar_arch=aarch64 ;;
          esac
          mkdir -p pkgs
          sh packaging/build-deb.sh "$out" "$version" "$deb_arch" pkgs
          docker run --rm -v "$PWD:/w" -w /w fedora:41 sh -c "dnf install -y -q rpm-build >/dev/null && sh packaging/build-rpm.sh vendor/server/target/${{ matrix.target }}/release $version $rpm_arch pkgs"
          sudo chown -R "$USER" pkgs
          mkdir -p "tarball/zherodizk-server-$version-$tar_arch"
          cp "$out"/zhd-rendezvous "$out"/zhd-relay "$out"/zhd-utils LICENSE NOTICE "tarball/zherodizk-server-$version-$tar_arch/"
          tar -C tarball -czf "pkgs/zherodizk-server-$version-linux-$tar_arch.tar.gz" "zherodizk-server-$version-$tar_arch"
          find pkgs -type f -name '*.rpm' -exec mv {} pkgs/ \; 2>/dev/null || true
          find pkgs -mindepth 1 -type d -empty -delete
          ls -l pkgs
          (cd pkgs && sha256sum -- *.deb *.rpm *.tar.gz > "$GITHUB_WORKSPACE/dist/build-report/packages.sha256")
          cat dist/build-report/packages.sha256
          dpkg-deb --info pkgs/*.deb | tee dist/build-report/deb-info.txt
          dpkg-deb --contents pkgs/*.deb | tee dist/build-report/deb-contents.txt
          docker run --rm -v "$PWD/pkgs:/pkgs:ro" fedora:41 sh -c 'rpm -qpl /pkgs/*.rpm; rpm -qpi /pkgs/*.rpm' | tee dist/build-report/rpm-contents.txt

      - name: Test packages on the runner with systemd (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo dpkg -i pkgs/*.deb
          getent passwd zherodizk
          sudo systemd-analyze verify /lib/systemd/system/zhd-rendezvous.service /lib/systemd/system/zhd-relay.service
          sudo systemctl start zhd-rendezvous zhd-relay
          sleep 5
          systemctl is-active zhd-rendezvous zhd-relay
          (echo > /dev/tcp/127.0.0.1/21116) && echo "rendezvous listens"
          (echo > /dev/tcp/127.0.0.1/21117) && echo "relay listens"
          ps -o user= -C zhd-rendezvous | sort -u | grep -qx zherodizk
          sudo ls -l /var/lib/zherodizk | tee dist/build-report/state-dir.txt
          test "$(sudo stat -c %a /var/lib/zherodizk/id_ed25519)" = 600
          test "$(sudo stat -c %a /var/lib/zherodizk)" = 750
          sudo systemctl stop zhd-rendezvous zhd-relay
          sudo apt-get remove -y zherodizk-server
          test ! -e /usr/bin/zhd-relay

      - name: Test installation in other distributions (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          : > dist/build-report/distro-results.txt
          mkdir -p dist/build-report/distro-logs
          for img in debian:12 ubuntu:22.04 ubuntu:24.04; do
            if docker run --rm -v "$PWD/pkgs:/pkgs:ro" "$img" sh -c 'apt-get update -qq && apt-get install -y /pkgs/*.deb && getent passwd zherodizk && zhd-utils genkeypair >/dev/null && echo OK' > "dist/build-report/distro-logs/${img//:/_}.log" 2>&1; then
              echo "PASS $img" >> dist/build-report/distro-results.txt
            else echo "FAIL $img" >> dist/build-report/distro-results.txt; fi
          done
          for img in rockylinux:9 almalinux:9 fedora:41; do
            if docker run --rm -v "$PWD/pkgs:/pkgs:ro" "$img" sh -c 'dnf install -y /pkgs/*.rpm && getent passwd zherodizk && zhd-utils genkeypair >/dev/null && echo OK' > "dist/build-report/distro-logs/${img//:/_}.log" 2>&1; then
              echo "PASS $img" >> dist/build-report/distro-results.txt
            else echo "FAIL $img" >> dist/build-report/distro-results.txt; fi
          done
          for img in alt:p11 alt:p10; do
            if docker run --rm -v "$PWD/pkgs:/pkgs:ro" "$img" sh -c 'rpm -i /pkgs/*.rpm && id zherodizk && zhd-utils genkeypair >/dev/null && echo OK' > "dist/build-report/distro-logs/${img//:/_}.log" 2>&1; then
              echo "PASS $img" >> dist/build-report/distro-results.txt
            else echo "FAIL $img" >> dist/build-report/distro-results.txt; fi
          done
          if docker run --rm -v "$PWD/pkgs:/pkgs:ro" alpine:3.20 sh -c 'tar -xzf /pkgs/*.tar.gz -C /tmp && /tmp/zherodizk-server-*/zhd-utils genkeypair >/dev/null && echo OK' > dist/build-report/distro-logs/alpine.log 2>&1; then
            echo "PASS alpine:3.20 (tarball)" >> dist/build-report/distro-results.txt
          else echo "FAIL alpine:3.20 (tarball)" >> dist/build-report/distro-results.txt; fi
          cat dist/build-report/distro-results.txt

      - name: Test Docker image and Compose (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          mkdir -p bin/amd64
          cp vendor/server/target/${{ matrix.target }}/release/zhd-* bin/amd64/
          docker build -f packaging/docker/Dockerfile --build-arg BIN_DIR=bin/amd64 -t zherodizk-server:local .
          docker compose -f packaging/docker/docker-compose.yml up -d
          sleep 8
          docker compose -f packaging/docker/docker-compose.yml ps | tee dist/build-report/compose-ps.txt
          (echo > /dev/tcp/127.0.0.1/21116) && echo "compose rendezvous listens"
          (echo > /dev/tcp/127.0.0.1/21117) && echo "compose relay listens"
          docker compose -f packaging/docker/docker-compose.yml logs --no-color > dist/build-report/compose.log
          docker compose -f packaging/docker/docker-compose.yml down -v

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-build-evidence-${{ matrix.target }}
          path: dist/build-report/
          if-no-files-found: warn
          retention-days: 14
